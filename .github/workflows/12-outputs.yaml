name: 12 - Working with Outputs

on:
    workflow_dispatch:
        inputs:
            build-status:
                type: choice
                options:
                    - success
                    - failure


jobs:
    build:
        runs-on: ubuntu-latest
        outputs:
            build-output: ${{ steps.step-id.outputs.Status }}
            build-output1: ${{ steps.step-id.outputs.output1 }}
            build-output2: ${{ steps.step-id.outputs.output2 }}
        steps:
            - name: 'Pre Print Github Output'
              run: |
                cat $GITHUB_OUTPUT
            - name: 'Build'
              id: step-id
              run: |
                echo "Status=${{ inputs.build-status }}" >> "$GITHUB_OUTPUT"
                echo "output1=value1" >> "$GITHUB_OUTPUT"
                echo "output2=value2" >> "$GITHUB_OUTPUT"
                cat $GITHUB_OUTPUT
                echo "mistake=true" > "$GITHUB_OUTPUT"
                cat $GITHUB_OUTPUT

    deploy:
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: 'Print Deploy Output'
              run: echo ${{ needs.build.outputs.build-output1 }}
