name: Publish runner image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable image tag to publish
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/lingarajkar/github-action-labs-runner
      IMAGE_TAG: ${{ inputs.image_tag || github.ref_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish runner image
        uses: docker/build-push-action@v6
        with:
          context: docker/runner
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}