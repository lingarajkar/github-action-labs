name: Publish runner image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable image tag to publish
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: runner-image-deployment
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/lingarajkar/github-action-labs-runner
      IMAGE_TAG: ${{ inputs.image_tag || github.ref_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish runner image
        uses: docker/build-push-action@v6
        with:
          context: docker/runner
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Check out deployment configuration
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update runner image tag
        run: |
          sed -i -E "s|^([[:space:]]*tag:[[:space:]]*).*|\1${IMAGE_TAG}|" deploy/arc-runner/values.yaml

      - name: Commit deployment configuration
        run: |
          if git diff --quiet -- deploy/arc-runner/values.yaml; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/arc-runner/values.yaml
          git commit -m "chore: deploy runner image ${IMAGE_TAG}"
          git push origin HEAD:main
